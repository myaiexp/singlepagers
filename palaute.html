<!DOCTYPE html>
<!-- Fast keyboard-first data-entry tool for the Työhyvinvoinnin huipulla 2026 paper feedback form -->
<html lang="fi">
<head>
<meta charset="UTF-8">
<!-- ExcelJS is loaded on demand from cdnjs (SRI-pinned) for the preferred .xlsx
     export; everything else is inline. Offline, CDN failure, or a hung request
     (8s timeout) falls back to a same-data JSON download (exportJsonFallback) —
     no network required. cdnjs is whitelisted in script-src; 'unsafe-inline'
     covers the page's inline script and style; no 'unsafe-eval' needed
     (ExcelJS's Function() calls are unreachable global-detection fallbacks in
     modern browsers). object-src 'none' + base-uri 'self' add hardening. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palaute · Työhyvinvoinnin huipulla 2026</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-tint: #ccfbf1;
    --danger: #dc2626;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  /* ---- Top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .topbar .title { font-size: 15px; font-weight: 600; }
  .topbar .title small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .actions { display: flex; align-items: center; gap: 10px; }
  .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  /* ---- Buttons ---- */
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 8px 14px; transition: background .12s, border-color .12s, color .12s;
  }
  button:hover { background: #f9fafb; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: #fca5a5; }
  button.danger:hover { background: #fef2f2; }
  /* ---- Layout ---- */
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 24px;
  }
  .hidden { display: none !important; }
  .form-no { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form-no.editing { color: var(--accent-dark); font-weight: 600; }
  fieldset { border: none; margin-bottom: 22px; }
  legend, .field-label {
    font-size: 13px; font-weight: 600; color: var(--ink);
    margin-bottom: 8px; display: block;
  }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  /* ---- Choice rows (attendance / recommend) ---- */
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px;
    background: var(--card); font-size: 14px;
  }
  .choice .key { font-size: 11px; color: var(--muted); margin-right: 6px; }
  .choice.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .choice.sel .key { color: #d1fae5; }
  /* ---- Rating grid ---- */
  .scale-legend { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .grid { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .grid-row { display: grid; grid-template-columns: 1fr repeat(5, 44px) 44px; align-items: stretch; }
  .grid-row + .grid-row { border-top: 1px solid var(--line); }
  .grid-row.head { background: #f9fafb; font-size: 12px; color: var(--muted); }
  .grid-row.head .glabel { font-weight: 600; }
  .grid-row.cursor { background: var(--accent-tint); }
  .glabel { padding: 9px 12px; font-size: 13px; display: flex; align-items: center; }
  .gcell {
    border-left: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; user-select: none; color: var(--muted);
  }
  .grid-row.head .gcell { cursor: default; }
  .gcell:hover:not(.head-cell) { background: #f0fdfa; }
  .gcell.on { background: var(--accent); color: #fff; font-weight: 600; }
  .gcell.skip { color: #cbd5e1; font-style: italic; }
  /* ---- Free text + suggestions ---- */
  .ftblock { margin-bottom: 18px; position: relative; }
  textarea {
    width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; resize: vertical; min-height: 46px; color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--accent-tint); border-color: var(--accent); }
  .suggest {
    position: absolute; left: 0; right: 0; z-index: 10; margin-top: 2px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); max-height: 220px; overflow-y: auto;
  }
  .suggest-item {
    display: flex; justify-content: space-between; gap: 10px; padding: 8px 11px;
    font-size: 13px; cursor: pointer; border-bottom: 1px solid #f3f4f6;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item.active, .suggest-item:hover { background: var(--accent-tint); }
  .suggest-item .freq { color: var(--accent-dark); font-size: 12px; white-space: nowrap; }
  .suggest-head { padding: 6px 11px; font-size: 11px; color: var(--muted); background: #f9fafb; }
  /* ---- Raffle ---- */
  .raffle { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .raffle input { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  .raffle input:focus { outline: 2px solid var(--accent-tint); border-color: var(--accent); }
  .raffle-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
  /* ---- Save footer ---- */
  .save-row { display: flex; align-items: center; gap: 14px; margin-top: 8px; padding-top: 18px; border-top: 1px solid var(--line); }
  .save-row .hint { flex: 1; }
  /* ---- Review list ---- */
  .review-empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .rev-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rev-item:last-child { border-bottom: none; }
  .rev-no { font-weight: 600; width: 34px; color: var(--muted); }
  .rev-body { flex: 1; min-width: 0; font-size: 13px; }
  .rev-meta { color: var(--muted); }
  .rev-snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .rev-actions { display: flex; gap: 6px; }
  .rev-actions button { padding: 5px 10px; font-size: 13px; }
  .danger-zone { margin-top: 24px; display: flex; justify-content: flex-end; }
  @media (max-width: 560px) {
    .raffle { grid-template-columns: 1fr; }
    .grid-row { grid-template-columns: 1fr repeat(5, 36px) 36px; }
    .topbar .title small { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="title">Palaute<small>Työhyvinvoinnin huipulla 2026 · Oulu 21.–22.5.</small></div>
  <div class="actions">
    <span class="count" id="count">0 tallennettu</span>
    <button id="reviewBtn" class="ghost">Tarkastele</button>
    <button id="exportBtn" class="primary">Vie Excel</button>
  </div>
</header>

<main>
  <!-- ===== ENTRY VIEW ===== -->
  <section id="entry" class="card"></section>

  <!-- ===== REVIEW VIEW ===== -->
  <section id="review" class="card hidden"></section>
</main>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Static config — mirrors the paper form exactly
 * ------------------------------------------------------------------ */
const STORAGE_KEY = "palaute_huippu2026_v1";
const STORAGE_RECOVERY_KEY = STORAGE_KEY + "_recovery";

const ATTENDANCE = [
  { value: "both", label: "Molemmat päivät" },
  { value: "thu",  label: "Torstai" },
  { value: "fri",  label: "Perjantai" },
];
const RATING_ITEMS = [
  "Tapahtuman kokonaisuus",
  "Ohjelman ajankohtaisuus",
  "Sain työssä hyödynnettävää tietoa",
  "Luennoitsijoiden asiantuntemus",
  "Aikataulun toimivuus",
  "Tilat ja käytännön järjestelyt",
  "Näytteilleasettajilta saatu tieto",
];
const SCALE = "1 = heikko · 2 = välttävä · 3 = hyvä · 4 = erittäin hyvä · 5 = erinomainen";
const RECOMMEND = [
  { value: "kylla", label: "Kyllä" },
  { value: "ehka",  label: "Ehkä" },
  { value: "en",    label: "En" },
];
const FREETEXT = [
  { key: "best",    question: "Mikä oli päivien parasta antia?" },
  { key: "improve", question: "Missä oli mielestäsi kehitettävää?" },
  { key: "topics",  question: "Mitä aiheita toivoisit tuleviin koulutuspäiviin?" },
  { key: "open",    question: "Vapaa palaute tai kehitysidea" },
];

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
let storageUnreadable = false; // true when STORAGE_KEY holds a blob load() could not use
let deletedIds = new Set(); // ids removed on purpose; a merge must not bring them back
let forms = load();        // array of saved form objects
let baseJson = snapshotForms(forms); // JSON per id at the last successful read or write
let current = blankForm(); // form being entered/edited
let editingId = null;      // id of form being edited, or null for a new one
let cursor = { section: "attendance" }; // keyboard cursor; null once entry moves to the text fields

function blankForm() {
  return {
    id: null,
    attendance: null,
    ratings: Array(RATING_ITEMS.length).fill(null),
    recommend: null,
    free: Object.fromEntries(FREETEXT.map(ft => [ft.key, ""])),
    name: "",
    phone: "",
  };
}
function cloneForm(f) {
  return JSON.parse(JSON.stringify(f));
}

// Read one key as { status, value }: 'absent' (nothing stored, or storage
// unreachable), 'corrupt' (stored but not JSON, or JSON that is not an array)
// or 'ok'. `value` is the saved forms, or [] for absent and corrupt.
function readFormsKey(key) {
  let raw;
  try {
    raw = localStorage.getItem(key);
  } catch (e) {
    return { status: "absent", value: [] };
  }
  if (!raw) return { status: "absent", value: [] };
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    return { status: "corrupt", value: [] };
  }
  return Array.isArray(data) ? { status: "ok", value: data } : { status: "corrupt", value: [] };
}
// Deletes live beside the forms array. Folding them into that array would make
// it a non-array, and load() would treat every existing store as corrupt.
function deletedStorageKey(formsKey) {
  return formsKey + "_deleted";
}
function snapshotForms(list) {
  const m = new Map();
  for (const f of list) {
    if (f && typeof f.id === "string") m.set(f.id, JSON.stringify(f));
  }
  return m;
}
function readDeletedIds(key) {
  let raw;
  try {
    raw = localStorage.getItem(key);
  } catch (e) {
    return new Set();
  }
  if (!raw) return new Set();
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) return new Set();
    return new Set(data.filter(id => typeof id === "string" && id));
  } catch (e) {
    return new Set();
  }
}
function withoutDeleted(list) {
  return list.filter(f => !f || typeof f.id !== "string" || !deletedIds.has(f.id));
}
function newId() {
  return (typeof crypto !== "undefined" && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(36).slice(2, 7);
}
// No attendance, rating, recommend, free text, name or phone. Whitespace-only
// text is empty. The id does not count: a blank edit of a saved row is still blank.
function isBlankResponse(form) {
  if (!form) return true;
  if (form.attendance) return false;
  if (form.recommend) return false;
  if (Array.isArray(form.ratings) && form.ratings.some(r => r != null)) return false;
  const free = form.free || {};
  for (const ft of FREETEXT) {
    if (String(free[ft.key] || "").trim()) return false;
  }
  if (String(form.name || "").trim()) return false;
  if (String(form.phone || "").trim()) return false;
  return true;
}
function load() {
  const stored = readFormsKey(STORAGE_KEY);
  if (stored.status !== "corrupt") {
    deletedIds = readDeletedIds(deletedStorageKey(STORAGE_KEY));
    return withoutDeleted(stored.value);
  }
  // Unreadable blob: keep it. persist() writes STORAGE_RECOVERY_KEY instead
  // so a later save cannot destroy the only copy of event responses.
  storageUnreadable = true;
  alert("⚠ Tallennettuja vastauksia ei voitu lukea (selaimen tallenne on vioittunut).\n\n" +
        "Alkuperäistä tallennetta ei ylikirjoiteta. Voit jatkaa syöttöä ja viedä " +
        "tiedot (Vie Excel). Uudet lomakkeet tallennetaan erilliseen palautuskopioon.");
  deletedIds = readDeletedIds(deletedStorageKey(STORAGE_RECOVERY_KEY));
  return withoutDeleted(readFormsKey(STORAGE_RECOVERY_KEY).value);
}
// Union this tab's rows with whatever is on disk now. Memory order first, then
// ids only the other tab has. An id in deletedIds stays gone. A row this tab
// has not changed since baseJson must not overwrite the other tab's edit; if
// both changed, both versions are kept.
function mergeForms(stored, memory) {
  const storedById = new Map();
  for (const f of stored) {
    if (f && typeof f.id === "string") storedById.set(f.id, f);
  }
  const seen = new Set();
  const out = [];
  let conflict = false;
  let revived = false;
  for (const f of memory) {
    if (!f || typeof f.id !== "string" || seen.has(f.id)) continue;
    seen.add(f.id);
    if (deletedIds.has(f.id)) {
      const base = baseJson.get(f.id);
      if (base !== undefined && JSON.stringify(f) !== base) {
        const copy = cloneForm(f);
        copy.id = newId();
        out.push(copy);
        revived = true;
      }
      continue;
    }
    const disk = storedById.get(f.id);
    if (!disk) { out.push(f); continue; }
    const memJson = JSON.stringify(f);
    const diskJson = JSON.stringify(disk);
    if (memJson === diskJson) { out.push(f); continue; }
    const base = baseJson.get(f.id);
    if (base === undefined || diskJson === base) { out.push(f); continue; }
    if (memJson === base) { out.push(disk); continue; }
    out.push(f);
    const copy = cloneForm(disk);
    copy.id = newId();
    out.push(copy);
    conflict = true;
  }
  for (const f of stored) {
    if (!f || typeof f.id !== "string" || seen.has(f.id) || deletedIds.has(f.id)) continue;
    seen.add(f.id);
    out.push(f);
  }
  return { forms: out, conflict, revived };
}
function persist() {
  const key = storageUnreadable ? STORAGE_RECOVERY_KEY : STORAGE_KEY;
  const delKey = deletedStorageKey(key);
  const read = readFormsKey(key);
  const stored = read.status === "ok" ? read.value : [];
  for (const id of readDeletedIds(delKey)) deletedIds.add(id);
  const merged = mergeForms(stored, forms);
  forms = merged.forms;
  try {
    // Record the suppression before the shrunk array, so a crash between the
    // two writes cannot resurrect an id the next load would otherwise show.
    localStorage.setItem(delKey, JSON.stringify([...deletedIds]));
    localStorage.setItem(key, JSON.stringify(forms));
    baseJson = snapshotForms(forms);
  } catch (e) {
    // Quota exceeded (or storage disabled): the write failed, but `forms` is
    // still intact in memory and fully exportable. Warn the operator to export
    // now rather than silently reporting a save that never reached disk.
    alert("⚠ Selaimen tallennustila on täynnä eikä tietoja voitu tallentaa pysyvästi.\n\n" +
          "Vie tiedot heti (Vie Excel) — tähän mennessä syötetyt lomakkeet ovat " +
          "yhä muistissa ja mukana viennissä, mutta katoavat jos suljet välilehden.");
  }
  if (merged.conflict) {
    alert("Samaa vastausta oli muokattu toisessa välilehdessä. Molemmat versiot säilytettiin.");
  }
  if (merged.revived) {
    alert("Muokattava lomake oli poistettu toisessa välilehdessä. Muutokset tallennettiin uutena lomakkeena.");
  }
  updateCount();
}
function updateCount() {
  document.getElementById("count").textContent = forms.length + " tallennettu";
}

/* ------------------------------------------------------------------ *
 * Free-text suggestion engine (no AI — fuzzy bigram similarity)
 * ------------------------------------------------------------------ */
function norm(s) { return (s || "").toLowerCase().trim().replace(/\s+/g, " "); }
function bigrams(s) {
  s = norm(s).replace(/\s/g, "");
  const out = [];
  for (let i = 0; i < s.length - 1; i++) out.push(s.slice(i, i + 2));
  return out;
}
function diceSimilarity(a, b) {
  const A = bigrams(a), B = bigrams(b);
  if (!A.length || !B.length) return norm(a) === norm(b) ? 1 : 0;
  const counts = {};
  A.forEach(g => counts[g] = (counts[g] || 0) + 1);
  let inter = 0;
  B.forEach(g => { if (counts[g] > 0) { inter++; counts[g]--; } });
  return (2 * inter) / (A.length + B.length);
}
// Distinct prior answers for a question, with frequency, sorted by count.
function distinctAnswers(key) {
  const map = new Map();
  forms.forEach(f => {
    const t = (f.free[key] || "").trim();
    if (!t) return;
    const k = norm(t);                       // group case/whitespace-insensitively
    const prev = map.get(k);                 // keep first-seen casing for display
    map.set(k, { text: prev ? prev.text : t, count: (prev ? prev.count : 0) + 1 });
  });
  return [...map.values()].sort((a, b) => b.count - a.count);
}
// Suggestions for the current input: substring + fuzzy match, ranked.
function suggestionsFor(key, input) {
  const all = distinctAnswers(key);
  const q = norm(input);
  if (!q) return all.slice(0, 6);                    // empty input → most common
  return all
    .map(a => {
      const sub = norm(a.text).includes(q) ? 0.5 : 0; // substring boost
      return { ...a, score: diceSimilarity(q, a.text) + sub };
    })
    .filter(a => a.score > 0.2)
    .sort((a, b) => b.score - a.score || b.count - a.count)
    .slice(0, 6);
}

/* ------------------------------------------------------------------ *
 * Entry view rendering
 * ------------------------------------------------------------------ */
const entryEl = document.getElementById("entry");

function renderEntry() {
  const formNo = editingId !== null
    ? `<div class="form-no editing">Muokataan lomaketta #${forms.findIndex(f => f.id === editingId) + 1}</div>`
    : `<div class="form-no">Lomake #${forms.length + 1}</div>`;

  entryEl.innerHTML =
    formNo +
    attendanceHTML() +
    ratingHTML() +
    recommendHTML() +
    freetextHTML() +
    raffleHTML() +
    saveRowHTML();

  bindEntry();
  refreshCursor();
}

function attendanceHTML() {
  const opts = ATTENDANCE.map((a, i) => `
    <button class="choice att ${current.attendance === a.value ? "sel" : ""}" data-value="${a.value}">
      <span class="key">${i + 1}</span>${a.label}</button>`).join("");
  return `<fieldset><legend>Osallistuin</legend><div class="choices">${opts}</div></fieldset>`;
}

function ratingHTML() {
  let rows = `<div class="grid-row head">
    <div class="glabel">Arvioitava asia</div>
    ${[1,2,3,4,5].map(n => `<div class="gcell head-cell">${n}</div>`).join("")}
    <div class="gcell head-cell">–</div></div>`;
  RATING_ITEMS.forEach((label, r) => {
    const cells = [1,2,3,4,5].map(n =>
      `<div class="gcell ${current.ratings[r] === n ? "on" : ""}" data-row="${r}" data-val="${n}">${current.ratings[r] === n ? n : ""}</div>`
    ).join("");
    const skip = `<div class="gcell skip" data-row="${r}" data-val="0" title="Ohita">–</div>`;
    rows += `<div class="grid-row" data-rating-row="${r}"><div class="glabel">${label}</div>${cells}${skip}</div>`;
  });
  return `<fieldset>
    <legend>Arviointi <span class="hint">— näppäimet 1–5, 0 ohittaa</span></legend>
    <div class="scale-legend">${SCALE}</div>
    <div class="grid">${rows}</div>
  </fieldset>`;
}

function recommendHTML() {
  const opts = RECOMMEND.map((r, i) => `
    <button class="choice rec ${current.recommend === r.value ? "sel" : ""}" data-value="${r.value}">
      <span class="key">${i + 1}</span>${r.label}</button>`).join("");
  return `<fieldset><legend>Suosittelisitko koulutuspäiviä kollegalle?</legend>
    <div class="choices">${opts}</div></fieldset>`;
}

function freetextHTML() {
  return `<fieldset><legend>Avoimet vastaukset <span class="hint">— ehdotukset auttavat ryhmittelyssä</span></legend>` +
    FREETEXT.map(ft => `
      <div class="ftblock" data-ftkey="${ft.key}">
        <label class="field-label" for="ft-${ft.key}">${ft.question}</label>
        <textarea id="ft-${ft.key}" data-ftkey="${ft.key}" rows="2">${escapeHtml(current.free[ft.key])}</textarea>
      </div>`).join("") +
    `</fieldset>`;
}

function raffleHTML() {
  return `<fieldset><legend>Arvonta <span class="hint">— vapaaehtoinen</span></legend>
    <div class="raffle">
      <div><label class="field-label" for="r-name">Nimi</label>
        <input id="r-name" type="text" autocomplete="off" value="${escapeHtml(current.name)}"></div>
      <div><label class="field-label" for="r-phone">Puhelinnumero</label>
        <input id="r-phone" type="text" autocomplete="off" value="${escapeHtml(current.phone)}"></div>
    </div>
    <p class="raffle-note">Yhteystiedot tallentuvat vain tähän selaimeen arvontaa varten.
      Vie tiedot Exceliin ja tyhjennä lomakkeet (Tarkastele → Tyhjennä kaikki) tapahtuman jälkeen.
      Tyhjennä kaikki ei poista selaimen automaattisen täytön muistamia tietoja — käytä
      yksityistä ikkunaa tai tyhjennä selaimen tallennetut lomaketiedot tapahtuman jälkeen.</p>
  </fieldset>`;
}

function saveRowHTML() {
  const cancel = editingId !== null
    ? `<button id="cancelBtn" class="ghost">Peruuta muokkaus</button>` : "";
  const saveLabel = editingId !== null ? "Tallenna muutokset" : "Tallenna ja seuraava";
  return `<div class="save-row">
    <span class="hint">Vinkki: Ctrl + Enter tallentaa</span>
    ${cancel}
    <button id="saveBtn" class="primary">${saveLabel}</button>
  </div>`;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ------------------------------------------------------------------ *
 * Entry interactions
 * ------------------------------------------------------------------ */
function bindEntry() {
  entryEl.querySelectorAll(".att").forEach(b =>
    b.onclick = () => selectAttendance(b.dataset.value));

  entryEl.querySelectorAll(".gcell[data-row]").forEach(c =>
    c.onclick = () => setRating(+c.dataset.row, +c.dataset.val));

  entryEl.querySelectorAll(".rec").forEach(b =>
    b.onclick = () => selectRecommend(b.dataset.value));

  FREETEXT.forEach(ft => {
    const ta = entryEl.querySelector(`#ft-${ft.key}`);
    ta.addEventListener("input", () => { current.free[ft.key] = ta.value; showSuggest(ft.key, ta); });
    ta.addEventListener("focus", () => { cursor = null; refreshCursor(); showSuggest(ft.key, ta); });
    ta.addEventListener("blur", () => setTimeout(() => hideSuggest(ft.key), 150));
    ta.addEventListener("keydown", e => suggestKeydown(e, ft.key, ta));
  });

  entryEl.querySelector("#r-name").addEventListener("input", e => current.name = e.target.value);
  entryEl.querySelector("#r-phone").addEventListener("input", e => current.phone = e.target.value);

  entryEl.querySelector("#saveBtn").onclick = saveForm;
  const cb = entryEl.querySelector("#cancelBtn");
  if (cb) cb.onclick = cancelEdit;
}

// Mouse (bindEntry) and keyboard (routeNumberKey) both pick through these three,
// so the cursor hand-off cannot drift between the two paths.
function selectAttendance(v) {
  current.attendance = v;
  cursor = { section: "rating", row: 0 };
  renderEntry();
}

function setRating(row, val) {
  current.ratings[row] = val === 0 ? null : val;
  cursor = row < RATING_ITEMS.length - 1 ? { section: "rating", row: row + 1 } : { section: "recommend" };
  renderEntry();
}

function selectRecommend(v) {
  current.recommend = v;
  cursor = null;
  // Render before focusing: renderEntry replaces entryEl.innerHTML, so a
  // textarea focused first is detached and focus falls back to <body>.
  renderEntry();
  focusFirstText();
}

function refreshCursor() {
  entryEl.querySelectorAll(".grid-row").forEach(r => r.classList.remove("cursor"));
  entryEl.querySelectorAll(".att, .rec").forEach(b => b.style.outline = "");
  if (cursor?.section === "attendance") {
    entryEl.querySelectorAll(".att").forEach(b => b.style.outline = "2px solid var(--accent-tint)");
  } else if (cursor?.section === "rating") {
    const el = entryEl.querySelector(`.grid-row[data-rating-row="${cursor.row}"]`);
    if (el) el.classList.add("cursor");
  } else if (cursor?.section === "recommend") {
    entryEl.querySelectorAll(".rec").forEach(b => b.style.outline = "2px solid var(--accent-tint)");
  }
}

function focusFirstText() {
  const ta = entryEl.querySelector(`#ft-${FREETEXT[0].key}`);
  if (ta) ta.focus();
}

/* ---- Suggestion dropdown ---- */
let suggestState = {}; // key -> { items, active }

function showSuggest(key, ta) {
  const items = suggestionsFor(key, ta.value);
  hideSuggest(key);
  if (!items.length) return;
  suggestState[key] = { items, active: -1 };
  const block = ta.closest(".ftblock");
  const box = document.createElement("div");
  box.className = "suggest";
  box.dataset.for = key;
  const head = ta.value.trim() ? "Samankaltaiset aiemmat vastaukset" : "Yleisimmät vastaukset";
  box.innerHTML = `<div class="suggest-head">${head}</div>` + items.map((it, i) =>
    `<div class="suggest-item" data-i="${i}">
       <span>${escapeHtml(it.text)}</span><span class="freq">×${it.count}</span></div>`).join("");
  box.querySelectorAll(".suggest-item").forEach(el =>
    el.addEventListener("mousedown", e => { e.preventDefault(); acceptSuggest(key, ta, +el.dataset.i); }));
  block.appendChild(box);
}
function hideSuggest(key) {
  const box = entryEl.querySelector(`.suggest[data-for="${key}"]`);
  if (box) box.remove();
  delete suggestState[key];
}
function acceptSuggest(key, ta, i) {
  const st = suggestState[key];
  if (!st || !st.items[i]) return;
  ta.value = st.items[i].text;
  current.free[key] = ta.value;
  hideSuggest(key);
}
function suggestKeydown(e, key, ta) {
  const st = suggestState[key];
  if (!st) return;
  const box = entryEl.querySelector(`.suggest[data-for="${key}"]`);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    st.active += e.key === "ArrowDown" ? 1 : -1;
    if (st.active < 0) st.active = st.items.length - 1;
    if (st.active >= st.items.length) st.active = 0;
    box.querySelectorAll(".suggest-item").forEach((el, i) =>
      el.classList.toggle("active", i === st.active));
  } else if (e.key === "Enter" && st.active >= 0) {
    e.preventDefault();
    acceptSuggest(key, ta, st.active);
  } else if (e.key === "Escape") {
    hideSuggest(key);
  }
}

/* ---- Save / cancel ---- */
function saveForm() {
  // A fully blank form is not a response: it would inflate the headcount and
  // the export. A second Ctrl+Enter hits this after the first save blanks current.
  if (isBlankResponse(current)) {
    alert("Tyhjää lomaketta ei tallenneta. Täytä vähintään yksi kohta, tai poista lomake.");
    return;
  }
  if (editingId !== null) {
    const idx = forms.findIndex(f => f.id === editingId);
    const saved = cloneForm(current);
    saved.id = editingId;
    if (idx !== -1) {
      forms[idx] = saved;
    } else {
      // The row went away mid-edit; keep the typed work rather than drop it.
      forms.push(saved);
      alert("Muokattava lomake oli poistettu. Muutokset tallennettiin uutena lomakkeena.");
    }
    resetEntry(); // the next blank entry starts on attendance
    persist();
    showReview();
    return;
  }
  const saved = cloneForm(current);
  saved.id = newId();
  forms.push(saved);
  persist();
  resetEntry();
  renderEntry();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetEntry() {
  editingId = null;
  current = blankForm();
  cursor = { section: "attendance" };
}
function cancelEdit() {
  resetEntry();
  showReview();
}
// True when `current` holds typing that a reset would lose: a new entry that
// differs from a blank form, or an edit that differs from its saved row.
function hasUnsavedEntry() {
  const base = editingId !== null && forms.find(f => f.id === editingId);
  return JSON.stringify(current) !== JSON.stringify(base || blankForm());
}

/* ------------------------------------------------------------------ *
 * Review view
 * ------------------------------------------------------------------ */
const reviewEl = document.getElementById("review");

function renderReview() {
  if (!forms.length) {
    reviewEl.innerHTML = `<div class="review-empty">Ei vielä tallennettuja lomakkeita.</div>`;
    return;
  }
  const items = forms.map((f, i) => {
    const rated = f.ratings.filter(r => r != null);
    const avg = rated.length ? (rated.reduce((a, b) => a + b, 0) / rated.length).toFixed(1) : "–";
    const att = attLabel(f.attendance) || "—";
    const rec = recLabel(f.recommend) || "—";
    const snip = f.free.best || f.free.improve || f.free.open || f.free.topics || "";
    return `<div class="rev-item">
      <div class="rev-no">#${i + 1}</div>
      <div class="rev-body">
        <div class="rev-snip">${escapeHtml(snip) || "<span class='rev-meta'>(ei avointa vastausta)</span>"}</div>
        <div class="rev-meta">${att} · ka ${avg} · suosittelee: ${rec}</div>
      </div>
      <div class="rev-actions">
        <button data-edit="${escapeHtml(f.id)}">Muokkaa</button>
        <button class="danger" data-del="${escapeHtml(f.id)}">Poista</button>
      </div>
    </div>`;
  }).join("");
  reviewEl.innerHTML = items +
    `<div class="danger-zone"><button class="danger" id="clearBtn">Tyhjennä kaikki</button></div>`;

  reviewEl.querySelectorAll("[data-edit]").forEach(b =>
    b.onclick = () => editForm(b.dataset.edit));
  reviewEl.querySelectorAll("[data-del]").forEach(b =>
    b.onclick = () => deleteForm(b.dataset.del));
  reviewEl.querySelector("#clearBtn").onclick = clearAll;
}

function editForm(id) {
  const f = forms.find(x => x.id === id);
  if (!f) return;
  if (id !== editingId) {
    if (hasUnsavedEntry() && !confirm("Syötössä on tallentamattomia muutoksia. " +
        "Hylätäänkö ne ja avataan tämä lomake muokattavaksi?")) return;
    current = cloneForm(f);
    editingId = id;
    cursor = { section: "attendance" };
  }
  showEntry();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function deleteForm(id) {
  if (!confirm("Poistetaanko tämä lomake?")) return;
  if (typeof id === "string" && id) deletedIds.add(id);
  forms = forms.filter(f => f.id !== id);
  if (id === editingId) resetEntry();
  persist();
  renderReview();
}
function clearAll() {
  if (!confirm("Poistetaanko KAIKKI " + forms.length + " lomaketta? Vie ensin Excel jos haluat säilyttää tiedot.")) return;
  // Explicit deletes for the ids this tab actually has. A row only another
  // tab has written is not in this list, and the merge below keeps it.
  for (const f of forms) {
    if (f && typeof f.id === "string") deletedIds.add(f.id);
  }
  forms = [];
  // The entry in progress goes too: an edit has lost its row, and a new entry
  // may hold raffle contacts the post-event wipe is meant to remove.
  resetEntry();
  // Recovery is always removed, or the next corrupt read would bring diverted
  // rows back. A corrupt canonical blob cannot be merged, so that reset
  // deletes it and returns later writes to STORAGE_KEY — but recovery rows
  // this tab never had are copied across first. A readable canonical key is
  // left for persist() to merge.
  try {
    if (storageUnreadable) {
      const recovered = readFormsKey(STORAGE_RECOVERY_KEY);
      for (const id of readDeletedIds(deletedStorageKey(STORAGE_RECOVERY_KEY))) deletedIds.add(id);
      const rows = recovered.status === "ok" ? recovered.value : [];
      forms = rows.filter(f => f && typeof f.id === "string" && !deletedIds.has(f.id));
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(deletedStorageKey(STORAGE_KEY));
      storageUnreadable = false;
    }
    localStorage.removeItem(STORAGE_RECOVERY_KEY);
    localStorage.removeItem(deletedStorageKey(STORAGE_RECOVERY_KEY));
  } catch (e) { /* storage disabled — in-memory wipe still stands */ }
  persist();
  if (forms.length) {
    alert("Toisessa välilehdessä oli vastauksia, joita tässä näkymässä ei ollut. Niitä ei poistettu.");
  }
  renderReview();
}

/* ------------------------------------------------------------------ *
 * View switching
 * ------------------------------------------------------------------ */
const reviewBtn = document.getElementById("reviewBtn");
function showEntry() {
  reviewEl.classList.add("hidden");
  entryEl.classList.remove("hidden");
  reviewBtn.textContent = "Tarkastele";
  renderEntry();
}
function showReview() {
  entryEl.classList.add("hidden");
  reviewEl.classList.remove("hidden");
  reviewBtn.textContent = "Takaisin syöttöön";
  renderReview();
}
reviewBtn.onclick = () =>
  reviewEl.classList.contains("hidden") ? showReview() : showEntry();

/* ------------------------------------------------------------------ *
 * Global keyboard fast-path (attendance / ratings / recommend)
 * ------------------------------------------------------------------ */
document.addEventListener("keydown", e => {
  // Ctrl/Cmd+Enter saves on the entry view. A held key auto-repeats; each
  // repeat would save another form after resetEntry blanks the current one.
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !entryEl.classList.contains("hidden")) {
    e.preventDefault();
    if (!e.repeat) saveForm();
    return;
  }
  // Don't hijack number keys while typing in a text field or on review view
  const tag = (document.activeElement || {}).tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (!entryEl.classList.contains("hidden") && /^[0-5]$/.test(e.key)) {
    routeNumberKey(+e.key);
    e.preventDefault();
  }
});

function routeNumberKey(n) {
  if (cursor?.section === "attendance") {
    if (n >= 1 && n <= ATTENDANCE.length) selectAttendance(ATTENDANCE[n - 1].value);
  } else if (cursor?.section === "rating") {
    setRating(cursor.row, n); // n=0 skips
  } else if (cursor?.section === "recommend") {
    if (n >= 1 && n <= RECOMMEND.length) selectRecommend(RECOMMEND[n - 1].value);
  }
}

/* ------------------------------------------------------------------ *
 * Export — Excel (.xlsx via ExcelJS) with offline JSON fallback
 * ------------------------------------------------------------------ */
// Shared value→label lookup for the {value,label} config arrays; "" when not found.
const labelFor = (arr, v) => (arr.find(x => x.value === v) || {}).label || "";
function attLabel(v) { return labelFor(ATTENDANCE, v); }
function recLabel(v) { return labelFor(RECOMMEND, v); }

// Load strategy and fallback: see the CSP comment in <head>. SRI rejects a
// tampered CDN payload; a failure or timeout drops the cached promise so the
// next export can retry the load.
const EXCELJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
const EXCELJS_SRI = "sha512-dlPw+ytv/6JyepmelABrgeYgHI0O+frEwgfnPdXDTOIZz+eDgfW07QXG02/O8COfivBdGNINy+Vex+lYmJ5rxw==";
let excelJsLoad = null;
let excelJsLoadTimeoutMs = 8000;
function loadExcelJS() {
  if (typeof ExcelJS !== "undefined") return Promise.resolve();
  if (excelJsLoad) return excelJsLoad;
  excelJsLoad = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = EXCELJS_URL;
    s.integrity = EXCELJS_SRI;
    s.crossOrigin = "anonymous";
    let timer = 0;
    const fail = (err) => {
      clearTimeout(timer);
      s.onload = s.onerror = null;
      if (typeof s.remove === "function") s.remove();
      excelJsLoad = null;
      reject(err);
    };
    timer = setTimeout(() => fail(new Error("ExcelJS load timed out")), excelJsLoadTimeoutMs);
    s.onload = () => { clearTimeout(timer); resolve(); };
    s.onerror = () => fail(new Error("ExcelJS load failed"));
    document.head.appendChild(s);
  });
  return excelJsLoad;
}

// Snapshot of the three sheet row arrays (and raw forms) for offline JSON export.
// Sheet builders are pure over `forms`, so this reuses the same data as .xlsx.
function buildExportPayload() {
  return {
    exportedAt: new Date().toISOString(),
    event: "Työhyvinvoinnin huipulla 2026",
    format: "palaute-export-v1",
    formCount: forms.length,
    forms: forms,
    sheets: {
      "Vastaukset": sheetResponses().rows,
      "Yhteenveto": sheetSummary().rows,
      "Avoimet teemat": sheetThemes().rows,
    },
  };
}

function exportJsonFallback() {
  const stamp = new Date().toISOString().slice(0, 10);
  const json = JSON.stringify(buildExportPayload(), null, 2);
  const blob = new Blob([json], { type: "application/json;charset=utf-8" });
  downloadBlob(blob, `palaute-huippu2026-${stamp}.json`);
}

async function exportXlsx() {
  const wb = new ExcelJS.Workbook();
  buildSheet(wb, "Vastaukset", sheetResponses());
  buildSheet(wb, "Yhteenveto", sheetSummary());
  buildSheet(wb, "Avoimet teemat", sheetThemes());
  const stamp = new Date().toISOString().slice(0, 10);
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(buf, `palaute-huippu2026-${stamp}.xlsx`);
}

// Prefer .xlsx when ExcelJS is reachable; never fail closed offline — fall back
// to JSON with the same three sheets so the venue can still extract all data.
async function exportForms() {
  if (!forms.length) { alert("Ei vielä tallennettuja lomakkeita."); return; }
  try {
    await loadExcelJS();
    await exportXlsx();
  } catch (e) {
    exportJsonFallback();
    alert("Excel-kirjasto ei latautunut (ei verkkoa?). Tiedot vietiin JSON-muodossa — " +
          "sama sisältö kuin Excelissä (Vastaukset, Yhteenveto, Avoimet teemat).");
  }
}

/* ---- Excel styling palette + helpers (one teal accent, light borders) ---- */
const XL = {
  teal: "FF0D9488",        // header fill
  tealDark: "FF0F766E",    // section / title text
  tealTint: "FFE6FFFA",    // section fill
  zebra: "FFF6F8FA",       // alternating row fill
  border: { style: "thin", color: { argb: "FFD9DEE5" } },
  headerFont: { bold: true, color: { argb: "FFFFFFFF" } },
};
XL.allBorders = { top: XL.border, left: XL.border, bottom: XL.border, right: XL.border };

function fillCell(cell, argb) {
  cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb } };
}
function styleHeaderRow(ws, rowNum, cols) {
  const row = ws.getRow(rowNum);
  row.height = 22;
  for (let c = 1; c <= cols; c++) {
    const cell = row.getCell(c);
    cell.font = XL.headerFont;
    fillCell(cell, XL.teal);
    cell.alignment = { vertical: "middle", horizontal: c === 1 ? "left" : "center" };
  }
}
function styleSectionRow(ws, rowNum, cols) {
  for (let c = 1; c <= cols; c++) {
    const cell = ws.getRow(rowNum).getCell(c);
    cell.font = { bold: true, color: { argb: XL.tealDark } };
    fillCell(cell, XL.tealTint);
  }
}
function applyBorders(ws, r1, r2, c1, c2) {
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) ws.getRow(r).getCell(c).border = XL.allBorders;
}
function centerCells(ws, r1, r2, cols) {
  for (let r = r1; r <= r2; r++)
    cols.forEach(c => ws.getRow(r).getCell(c).alignment = { horizontal: "center" });
}

// Turn a {rows, widths, style} descriptor into a styled ExcelJS worksheet.
function buildSheet(wb, name, { rows, widths, style }) {
  const ws = wb.addWorksheet(name);
  rows.forEach(row => ws.addRow(row));
  if (widths) widths.forEach((w, i) => { ws.getColumn(i + 1).width = w; });
  if (style) style(ws);
  return ws;
}

// The browser fetches a download's blob after click() returns; revoking the URL
// in the same tick can fail the download with nothing reported to the page, so
// the revoke waits (FileSaver.js does the same).
const BLOB_REVOKE_DELAY_MS = 60000;

// Accept either a Blob or a buffer/ArrayBuffer (xlsx writeBuffer).
function downloadBlob(data, filename) {
  const blob = data instanceof Blob ? data : new Blob([data], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), BLOB_REVOKE_DELAY_MS);
}

// Row accumulator for building a sheet's array-of-arrays: addRow appends a row
// and returns its 1-based row number; `count` is the running row total. Shared
// by sheetSummary and sheetThemes, which both track row numbers for styling.
function makeRowBuilder() {
  const rows = [];
  let n = 0;
  return {
    rows,
    addRow(row) { rows.push(row); return ++n; },
    get count() { return n; },
  };
}

// Sheet 1: raw rows, one per respondent
function sheetResponses() {
  const header = ["#", "Osallistui", ...RATING_ITEMS, "Suosittelisi",
    ...FREETEXT.map(f => f.question), "Nimi", "Puhelinnumero"];
  const dataRows = forms.map((f, i) => [
    i + 1, attLabel(f.attendance),
    ...f.ratings.map(r => r == null ? "" : r),
    recLabel(f.recommend),
    ...FREETEXT.map(ft => f.free[ft.key] || ""),
    f.name || "", f.phone || "",
  ]);
  const cols = header.length;
  const widths = header.map((h, i) => i === 0 ? 5 : Math.min(28, Math.max(10, h.length)));
  const rows = [header, ...dataRows];
  // Columns to centre: "#" plus the rating block. Header layout is
  // [#, Osallistui, ...RATING_ITEMS, Suosittelisi, ...], so ratings start at col 3.
  const INDEX_COL = 1;
  const RATING_COL_START = 3; // first rating column, after "#" and "Osallistui"
  const centeredCols = [INDEX_COL, ...RATING_ITEMS.map((_, i) => RATING_COL_START + i)];
  const style = (ws) => {
    ws.views = [{ state: "frozen", ySplit: 1 }];
    styleHeaderRow(ws, 1, cols);
    applyBorders(ws, 1, rows.length, 1, cols);
    for (let r = 2; r <= rows.length; r++) {
      if (r % 2 === 1) for (let c = 1; c <= cols; c++) fillCell(ws.getRow(r).getCell(c), XL.zebra);
    }
    centerCells(ws, 2, rows.length, centeredCols);
  };
  return { rows, widths, style };
}

// Sheet 2: aggregate stats
function sheetSummary() {
  const rb = makeRowBuilder();
  const titleRow = rb.addRow(["Yhteenveto — Työhyvinvoinnin huipulla 2026"]);
  const subRow = rb.addRow([`Vastauksia yhteensä: ${forms.length}`]);
  rb.addRow([]);
  const attendanceRow = rb.addRow(["Osallistuminen", "kpl"]);
  ATTENDANCE.forEach(a => rb.addRow([a.label, forms.filter(f => f.attendance === a.value).length]));
  rb.addRow([]);
  const ratingHeaderRow = rb.addRow(["Arviointi", "1", "2", "3", "4", "5", "Vastauksia", "Keskiarvo"]);
  const ratingFirstRow = rb.count + 1;
  RATING_ITEMS.forEach((label, i) => {
    const vals = forms.map(f => f.ratings[i]).filter(v => v != null);
    const counts = [1,2,3,4,5].map(n => forms.filter(f => f.ratings[i] === n).length);
    const avg = vals.length ? +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : "";
    rb.addRow([label, ...counts, vals.length, avg]);
  });
  const ratingLastRow = rb.count;
  rb.addRow([]);
  const recommendRow = rb.addRow(["Suosittelisi kollegalle", "kpl"]);
  RECOMMEND.forEach(rc => rb.addRow([rc.label, forms.filter(f => f.recommend === rc.value).length]));

  const style = (ws) => {
    ws.getCell(titleRow, 1).font = { bold: true, size: 14, color: { argb: XL.tealDark } };
    ws.getCell(subRow, 1).font = { italic: true, color: { argb: "FF6B7280" } };
    styleSectionRow(ws, attendanceRow, 2);
    styleSectionRow(ws, recommendRow, 2);
    styleHeaderRow(ws, ratingHeaderRow, 8);
    applyBorders(ws, ratingHeaderRow, ratingLastRow, 1, 8);
    centerCells(ws, ratingFirstRow, ratingLastRow, [2, 3, 4, 5, 6, 7, 8]);
    for (let rr = ratingFirstRow; rr <= ratingLastRow; rr++) ws.getCell(rr, 8).numFmt = "0.0";
    // Red→amber→green colour scale on the average column only
    ws.addConditionalFormatting({
      ref: `H${ratingFirstRow}:H${ratingLastRow}`,
      rules: [{
        type: "colorScale",
        cfvo: [{ type: "num", value: 1 }, { type: "num", value: 3 }, { type: "num", value: 5 }],
        color: [{ argb: "FFF8696B" }, { argb: "FFFFEB84" }, { argb: "FF63BE7B" }],
      }],
    });
  };
  return { rows: rb.rows, widths: [34, 7, 7, 7, 7, 7, 12, 11], style };
}

// Sheet 3: grouped free-text answers with counts
function sheetThemes() {
  const rb = makeRowBuilder();
  const titleRow = rb.addRow(["Avoimet teemat — ryhmitellyt vastaukset"]);
  rb.addRow([]);
  const blocks = [];
  FREETEXT.forEach(ft => {
    const headerRow = rb.addRow([ft.question, "kpl"]);
    const groups = distinctAnswers(ft.key);
    if (!groups.length) rb.addRow(["(ei vastauksia)", ""]);
    else groups.forEach(g => rb.addRow([g.text, g.count]));
    blocks.push({ headerRow, last: rb.count });
    rb.addRow([]);
  });
  const style = (ws) => {
    ws.getCell(titleRow, 1).font = { bold: true, size: 14, color: { argb: XL.tealDark } };
    ws.getColumn(1).alignment = { wrapText: true, vertical: "top" };
    ws.getColumn(2).alignment = { horizontal: "center", vertical: "top" };
    blocks.forEach(blk => {
      styleSectionRow(ws, blk.headerRow, 2);
      applyBorders(ws, blk.headerRow, blk.last, 1, 2);
    });
  };
  return { rows: rb.rows, widths: [60, 8], style };
}
